server {
    listen 80;
    server_name localhost;

    # 1. Serve Static UI Dashboard (index.html)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy all API requests to snipbot-proxy Gateway
    location /api/ {
        proxy_pass https://snipbot-proxy.up.railway.app/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host snipbot-proxy.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Enable CORS headers fallback
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
    }
}
